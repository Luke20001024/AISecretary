[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-backend"
version = "0.1.0"
description = "Local-first cognitive memory backend for Memento"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Memento" }]
dependencies = ["jsonschema>=4.18,<5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memento_backend = ["dataset_monitor_ui/*.html", "dataset_monitor_ui/*.css", "dataset_monitor_ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.9"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
